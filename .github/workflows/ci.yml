# Github actions workflow name
name: CI

# Triggers the workflow on push or pull request events
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 'Tests on ${{matrix.os}} with Go "${{matrix.go}}"'
    strategy:
      fail-fast: false
      matrix:
        # Test all mainstream operating systems
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x']
        include:
          - os: ubuntu-latest
            go: 'stable'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Print the Go version
        run: go version
      - name: Check formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Run the tests
        run: go test ./...
      - name: Build lessc
        run: go build -o lessc-build ./cmd/lessc

  copilot-review:
    name: Request Copilot review
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    permissions:
      pull-requests: write
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            -f "reviewers[]=copilot-pull-request-reviewer" \
          || echo "::warning::Could not request Copilot review (the token may lack pull-requests: write access, or Copilot PR reviews may not be enabled for this repository)"
