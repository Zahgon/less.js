name: Release

# Publishes a release when a version tag (vX.Y.Z or vX.Y.Z-alpha.N) is pushed: the Go module is versioned by the
# tag itself, and the lessc command is built for each platform and attached to the GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # Required for creating releases

jobs:
  release:
    name: Build and publish lessc
    runs-on: ubuntu-latest
    if: github.repository == 'less/less.js'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Check formatting, vet and test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Build lessc for every platform
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=''
            if [ "$os" = windows ]; then ext='.exe'; fi
            GOOS=$os GOARCH=$arch go build -trimpath -o "dist/lessc-${GITHUB_REF_NAME}-${os}-${arch}${ext}" ./cmd/lessc
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=''
          case "$GITHUB_REF_NAME" in *-*) prerelease='--prerelease' ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes $prerelease
